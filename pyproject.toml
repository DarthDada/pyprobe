[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprobe"
version = "0.1.0"
description = "CPython out-of-process inspection toolset (stack, memory, CPU)"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pyprobe = "pyprobe.cli:main"

# Web monitoring mode (ADR A13): minimal set — deliberately NOT
# fastapi[standard]'s full extras family. Core wheel stays dependency-free.
[project.optional-dependencies]
web = ["fastapi>=0.141.1", "uvicorn>=0.30"]

# Subpackages: kernel/ target/ cpython/ observe/ present/ web/ (ADR A8/A13);
# the find directive picks them up without per-package edits. Static assets
# (ADR A13) are listed as two explicit glob layers — no recursive `**`,
# keeping the setuptools>=61 floor (and with it the _common.sh fallback and
# the README offline instructions unchanged).
[tool.setuptools.packages.find]
include = ["pyprobe*"]

[tool.setuptools.package-data]
pyprobe = ["offsets.json", "web/static/*", "web/static/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    # starlette 1.6's testclient references the deprecated
    # anyio.abc.BlockingPortal alias at import time (third-party internal,
    # surfaces during test collection; not ours to fix).
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "integration: end-to-end tests that spawn a child process and read its memory (run: pytest -m integration)",
    "slow: tests that block on real wall-clock time — profiling durations and real sleeps (skip: scripts/run_tests.sh -- -m 'not slow')",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "watchfiles>=1.2; python_version>='3.12'",
    # web-mode test deps (ADR A13): plain fastapi + uvicorn mirror the
    # extras; httpx2 backs TestClient (starlette>=1.x prefers it over the
    # deprecated httpx fallback). Unmarked — testable on all of 3.11+.
    "fastapi>=0.141.1",
    "uvicorn>=0.30",
    "httpx2",
    "numpy>=2.5.3; python_version>='3.12'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF022"]
