[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprobe"
version = "0.1.0"
description = "CPython out-of-process inspection toolset (stack, memory, CPU)"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pyprobe = "pyprobe.cli:main"

[tool.setuptools]
packages = ["pyprobe"]

[tool.setuptools.package-data]
pyprobe = ["offsets.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "integration: end-to-end tests that spawn a child process and read its memory (run: pytest -m integration)",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5",
    "ruff>=0.6",
    "watchfiles>=1.2; python_version>='3.12'",
    "fastapi[standard]>=0.141.1; python_version>='3.12'",
    "numpy>=2.5.3; python_version>='3.12'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF022"]
