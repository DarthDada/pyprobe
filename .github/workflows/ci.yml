# Remote CI (TODO §7.1): enforce all-green commits by running the exact same
# pipeline as a local `scripts/ci.sh` (sync gen-offsets lint test smoke). The
# workflow must not hand-type build/test commands — everything is orchestrated
# by the scripts/ layer, so CI and local can't drift.
#
# UV_PYTHON_PREFERENCE=only-managed pins the pipeline to a uv-managed CPython
# (matching the committed .python-version, 3.12): the gen-offsets stage needs
# the interpreter's headers, and managed builds ship them while a bare distro
# python3 does not (python3-dev is not installed on hosted runners).
name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: CI pipeline (sync gen-offsets lint test smoke)
        run: scripts/ci.sh

  # Dual-tree phase (TODO §10): the next/ rebuild tree gets its own job so a
  # next-side failure is attributable at a glance and the legacy pipeline
  # timing stays unchanged. Removed at replacement (§10.6-2).
  next:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: next tree pipeline (sync lint next)
        run: scripts/ci.sh sync lint next
