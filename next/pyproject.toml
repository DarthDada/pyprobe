# next/ rebuild tree project config (TODO §10.4 batch 0).
#
# This file serves three roles while the dual-tree phase lasts:
#   1. pytest rootdir/config for the next suite, so `import pyprobe` in
#      next/tests resolves to next/pyprobe (pythonpath below), never the
#      frozen legacy tree — isolation comes from cwd + pythonpath, not from
#      renaming the package (§10.6 swaps directories, not names).
#   2. ruff config for next/ when scripts/lint.sh checks it from the repo
#      root (ruff picks the nearest pyproject.toml per file).
#   3. build config that becomes the root pyproject.toml at replacement
#      (§10.6-2), minus next-specific notes.
#
# It is NOT a separate uv project: scripts/next.sh runs everything with the
# root environment (`uv run --project ..`) so both trees share one venv.

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprobe"
version = "0.1.0"
description = "CPython out-of-process inspection toolset (stack, memory, CPU)"
readme = "../README.md"
requires-python = ">=3.11"

[project.scripts]
pyprobe = "pyprobe.cli:main"

# Subpackages land per batch (kernel/ target/ cpython/ observe/ present/);
# find-directive picks them up without per-batch edits.
[tool.setuptools.packages.find]
include = ["pyprobe*"]

[tool.setuptools.package-data]
pyprobe = ["offsets.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
markers = [
    "integration: end-to-end tests that spawn a child process and read its memory (run: pytest -m integration)",
    "slow: tests that block on real wall-clock time — profiling durations and real sleeps (skip: scripts/next.sh test -- -m 'not slow')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "RUF022"]
