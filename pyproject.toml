[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprobe"
version = "0.1.0"
description = "CPython out-of-process inspection toolset (stack, memory, CPU)"
readme = "README.md"
requires-python = ">=3.8"

[project.scripts]
pyprobe = "pyprobe.cli:main"

[tool.setuptools]
packages = ["pyprobe"]

[tool.setuptools.package-data]
pyprobe = ["offsets.json"]

[project.optional-dependencies]
dev = [
    "fastapi[standard]>=0.141.1; python_version>='3.12'",
    "numpy>=2.5.3; python_version>='3.12'",
]
