[project]
name = "pyprobe"
version = "0.1.0"
description = "CPython out-of-process inspection toolset (stack, memory, CPU)"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
pyprobe = "pyprobe.cli:main"

[tool.setuptools]
packages = ["pyprobe"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "fastapi[standard]>=0.141.1",
    "numpy>=2.5.3",
]
